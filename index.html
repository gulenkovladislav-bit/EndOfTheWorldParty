document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

te;\n  inset: 14%;\n  border: var(--tweak-border) solid var(--reticle-color);\n  border-radius: 50%;\n  opacity: 0.55;\n  animation: reticleSpin 22s linear infinite;\n}\n\n.reticle-ring-outer {\n  inset: 0;\n  border-style: solid;\n  border-color: var(--reticle-color);\n  opacity: 0.28;\n  animation: reticleSpin 36s linear infinite reverse,\n             reticlePulse 2.4s ease-in-out infinite;\n}\n\n.reticle-bracket {\n  position: absolute;\n  width: 18%;\n  height: 18%;\n  border: calc(var(--tweak-border) * 1.6) solid var(--reticle-color);\n}\n\n.reticle-tl { left: -4%; top: -4%; border-right: 0; border-bottom: 0; }\n.reticle-tr { right: -4%; top: -4%; border-left: 0; border-bottom: 0; }\n.reticle-bl { left: -4%; bottom: -4%; border-right: 0; border-top: 0; }\n.reticle-br { right: -4%; bottom: -4%; border-left: 0; border-top: 0; }\n\n.reticle-cross {\n  position: absolute;\n  background: rgba(245, 72, 72, 0.5);\n  box-shadow: none;\n}\n\n.reticle-cross-h {\n  left: -8%;\n  right: -8%;\n  top: 50%;\n  height: 1px;\n  transform: translateY(-50%);\n}\n\n.reticle-cross-v {\n  top: -8%;\n  bottom: -8%;\n  left: 50%;\n  width: 1px;\n  transform: translateX(-50%);\n}\n\n.reticle-dot {\n  position: absolute;\n  left: 50%;\n  top: 50%;\n  width: 6px;\n  height: 6px;\n  border: 0;\n  border-radius: 0;\n  background: var(--reticle-color);\n  transform: translate(-50%, -50%);\n  box-shadow: 0 0 0 2px rgba(245, 72, 72, 0.3);\n  animation: reticleBlink 1s ease-in-out infinite;\n}\n\n.reticle-callout {\n  position: absolute;\n  left: calc(100% + 14px);\n  top: 50%;\n  transform: translateY(-50%);\n  display: grid;\n  gap: 1px;\n  min-width: 180px;\n  padding: 6px 12px;\n  border: var(--tweak-border) solid var(--reticle-color);\n  background: rgba(0, 0, 0, 0.94);\n  box-shadow: none;\n  font-family: \"JetBrains Mono\", monospace;\n  text-transform: uppercase;\n  letter-spacing: 1.4px;\n  white-space: nowrap;\n}\n\n.reticle-callout::before {\n  content: \"\";\n  position: absolute;\n  right: 100%;\n  top: 50%;\n  width: 12px;\n  height: 1px;\n  background: var(--reticle-color);\n  box-shadow: none;\n}\n\n.reticle-callout b {\n  color: var(--reticle-color);\n  font-family: \"JetBrains Mono\", monospace;\n  font-size: 12px;\n  font-weight: 700;\n}\n\n.reticle-callout small {\n  color: var(--paper);\n  font-family: \"JetBrains Mono\", monospace;\n  font-size: 9px;\n  letter-spacing: 1.4px;\n  display: none;\n}\n\n.reticle.flip-callout .reticle-callout {\n  left: auto;\n  right: calc(100% + 14px);\n  text-align: right;\n}\n\n.reticle.flip-callout .reticle-callout::before {\n  right: auto;\n  left: 100%;\n}\n\n.reticle-scan {\n  position: absolute;\n  inset: -22%;\n  border-radius: 50%;\n  border: 1px solid var(--reticle-color);\n  opacity: 0;\n}\n\n.reticle.is-locking .reticle-scan {\n  animation: reticleLock 0.95s ease-out forwards;\n}\n\n.reticle.is-locking { animation: reticleShake 0.3s ease-in-out; }\n.reticle.is-traveling { filter: drop-shadow(0 0 calc(var(--tweak-glow) * 26px) var(--reticle-color)) brightness(1.1); }\n\n@keyframes reticleSpin {\n  to { transform: rotate(360deg); }\n}\n\n@keyframes reticlePulse {\n  0%, 100% { box-shadow: 0 0 0 0 rgba(245, 72, 72, 0); }\n  50% { box-shadow: 0 0 0 6px rgba(245, 72, 72, 0.12); }\n}\n\n@keyframes reticleBlink {\n  0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }\n  50% { opacity: 0.55; transform: translate(-50%, -50%) scale(1.3); }\n}\n\n@keyframes reticleLock {\n  0% { opacity: 0.9; inset: -10%; }\n  100% { opacity: 0; inset: -55%; }\n}\n\n@keyframes reticleShake {\n  0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }\n  20% { transform: translate(-52%, -50%) rotate(-1.2deg); }\n  40% { transform: translate(-48%, -51%) rotate(1.4deg); }\n  60% { transform: translate(-51%, -49%) rotate(-0.8deg); }\n  80% { transform: translate(-49%, -50%) rotate(0.6deg); }\n}\n\n/* ───────── dawn clock ───────── */\n\n.dawn-clock {\n  position: absolute;\n  right: 46px;\n  top: 64px;  background: var(--red);\n  color: #000;\n  font-family: \"JetBrains Mono\", monospace;\n  font-size: 10px;\n  letter-spacing: 2.6px;\n  font-weight: 700;\n}\n\n.hotkey-legend span {\n  padding: 4px 12px;\n}\n\n.hotkey-legend kbd {\n  display: inline-grid;\n  place-items: center;\n  min-width: 22px;\n  height: 20px;\n  margin-right: 4px;\n  padding: 0 6px;\n  border: 1px solid rgba(245, 72, 72, 0.45);\n  background: rgba(40, 0, 0, 0.45);\n  color: var(--red);\n  font-family: \"JetBrains Mono\", monospace;\n  font-size: 10px;\n  letter-spacing: 0;\n}\n\n/* ───────── control panel additions ───────── */\n\n.news-queue-wrap {\n  margin-top: 10px;\n}\n\n.news-queue-wrap label {\n  margin-bottom: 6px;\n  font-size: 10px;\n}\n\n.news-queue-list {\n  list-style: none;\n  display: grid;\n  gap: 5px;\n  margin: 0;\n  padding: 0;\n  max-height: 140px;\n  overflow-y: auto;\n}\n\n.news-queue-list li {\n  display: grid;\n  grid-template-columns: 18px 1fr 28px;\n  gap: 8px;\n  align-items: center;\n  padding: 6px 8px;\n  border: 1px solid rgba(196, 154, 96, 0.22);\n  background: rgba(0, 0, 0, 0.34);\n  color: rgba(214, 197, 163, 0.86);\n  font-size: 11px;\n  line-height: 1.25;\n}\n\n.news-queue-list li.is-current {\n  border-color: rgba(245, 72, 72, 0.6);\n  background: rgba(120, 11, 18, 0.28);\n  color: #ffd0a1;\n}\n\n.news-queue-list .nq-index {\n  color: var(--gold);\n  font-size: 10px;\n  text-align: center;\n}\n\n.news-queue-list .nq-text {\n  overflow-wrap: anywhere;\n}\n\n.news-queue-list .nq-remove {\n  width: 24px;\n  height: 24px;\n  min-height: 24px;\n  padding: 0;\n  font-size: 14px;\n  line-height: 1;\n}\n\n.news-queue-empty {\n  padding: 8px;\n  border: 1px dashed rgba(196, 154, 96, 0.22);\n  background: rgba(0, 0, 0, 0.22);\n  color: rgba(214, 197, 163, 0.4);\n  font-size: 11px;\n  text-align: center;\n  text-transform: uppercase;\n  letter-spacing: 0.7px;\n}\n\n.dawn-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 8px;\n}\n\n.dawn-grid input {\n  min-height: 36px;\n}\n\n.news-row {\n  margin-top: 8px;\n}\n\n/* ═════════════════════════════════════════════════════════════ */\n/* ═ HUD overrides — applies to whole controller               ═ */\n/* ═════════════════════════════════════════════════════════════ */\n\n/* hud-data block (bottom-left HUD data table) */\n\n.hud-data {\n  position: absolute;\n  left: 46px;\n  bottom: 96px;\n  z-index: 9;\n  display: grid;\n  grid-template-columns: auto 1fr;\n  column-gap: 14px;\n  row-gap: 4px;\n  margin: 0;\n  padding: 12px 16px;\n  border: var(--tweak-border) solid var(--red);\n  background: rgba(0, 0, 0, 0.88);\n  font-family: \"JetBrains Mono\", monospace;\n  font-size: 10px;\n  letter-spacing: 1.2px;\n  color: var(--paper);\n  min-width: 280px;\n  text-transform: uppercase;\n}\n\n.hud-data dt {\n  margin: 0;\n  color: rgba(245, 72, 72, 0.85);\n  font-weight: 700;\n  letter-spacing: 2px;\n}\n\n.hud-data dd {\n  margin: 0;\n  color: var(--paper);\n  font-variant-numeric: tabular-nums;\n}\n\nbody.presenter .hud-data { z-index: 13; }\n\n/* ── threat widget ── */\n\n.threat-widget {\n  position: absolute;\n  left: 48px;\n  top: 62px;\n  z-index: 14;\n  display: grid;\n  grid-template-columns: 56px 1fr;\n  grid-template-rows: auto auto;\n  column-gap: 12px;\n  row-gap: 6px;\n  align-items: center;\n  width: 280px;\n  min-height: 0;\n  padding: 10px 14px 12px;\n  background: rgba(0, 0, 0, 0.92);\n  border: var(--tweak-border) solid var(--line);\n  color: var(--paper);\n  font-family: \"JetBrains Mono\", monospace;\n  cursor: pointer;\n  text-align: left;\n  transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;\n}\n\n.threat-widget:hover {\n  border-color: var(--red);\n  box-shadow: 0 0 24px rgba(245, 72, 72, 0.18);\n  transform: none;\n}\n\n.threat-widget .tw-icon {\n  grid-row: 1 / span 2;\n  grid-column: 1;\n  display: grid;\n  place-items: center;\n  width: 56px;\n  height: 56px;\n  color: var(--threat-color, rgba(245, 72, 72, 0.55));\n  filter: drop-shadow(0 0 calc(var(--threat-glow, 0) * 12px) var(--threat-color));\n  transition: color 0.3s ease, filter 0.3s ease;\n}\n\n.threat-widget .tw-icon .tw-svg {\n  width: 100%;\n  height: 100%;\n  display: none;\n}\n\n.threat-widget[data-level=\"0\"] .tw-svg[data-icon=\"low\"],\n.threat-widget[data-level=\"1\"] .tw-svg[data-icon=\"low\"] { display: block; }\n.threat-widget[data-level=\"2\"] .tw-svg[data-icon=\"med\"],\n.threat-widget[data-level=\"3\"] .tw-svg[data-icon=\"med\"] { display: block; }\n.threat-widget[data-level=\"4\"] .tw-svg[data-icon=\"high\"],\n.threat-widget[data-level=\"5\"] .tw-svg[data-icon=\"high\"] { display: block; }\n.threat-widget[data-level=\"6\"] .tw-svg[data-icon=\"max\"] { display: block; }\n\n.threat-widget .tw-meta {\n  grid-row: 1;\n  grid-column: 2;\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 8px;\n}\n\n.threat-widget .tw-meta small {\n  color: var(--paper-dim);\n  font-family: \"JetBrains Mono\", monospace;\n  font-size: 9px;\n  letter-spacing: 2px;\n  text-transform: uppercase;\n}\n\n.threat-widget .tw-meta b {\n  font-family: \"Space Grotesk\", sans-serif;\n  font-weight: 700;\n  font-size: 26px;\n  line-height: 1;\n  color: var(--threat-color, var(--red));\n  letter-spacing: -0.5px;\n}\n\n.threat-widget .tw-meta b em {\n  font-style: normal;\n  font-size: 12px;\n  color: var(--paper-dim);\n  font-family: \"JetBrains Mono\", monospace;\n}\n\n.threat-widget .tw-track {\n  grid-row: 2;\n  grid-column: 2;\n  display: grid;\n  grid-template-columns: repeat(6, 1fr);\n  gap: 3px;\n}\n\n.threat-widget .tw-track i {\n  display: block;\n  height: 6px;\n  border: 1px solid rgba(245, 72, 72, 0.4);\n  background: rgba(245, 72, 72, 0.08);\n  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);\n}\n\n.threat-widget .tw-track i.is-on {\n  background: var(--threat-color, var(--red));\n  border-color: var(--threat-color, var(--red));\n}\n\n.threat-widget .tw-hint {\n  grid-column: 1 / -1;\n  grid-row: 3;\n  color: rgba(245, 72, 72, 0.4);\n  font-size: 8px;\n  letter-spacing: 1.4px;\n  text-transform: uppercase;\n  margin-top: 2px;\n  text-align: right;\n}\n\n/* per-level color/intensity */\n\n.threat-widget[data-level=\"0\"] { --threat-color: rgba(245, 72, 72, 0.45); --threat-glow: 0; }\n.threat-widget[data-level=\"1\"] { --threat-color: rgba(245, 72, 72, 0.6); --threat-glow: 0.2; }\n.threat-widget[data-level=\"2\"] { --threat-color: #ff5b3a; --threat-glow: 0.35; }\n.threat-widget[data-level=\"3\"] { --threat-color: #ff4438; --threat-glow: 0.5; }\n.threat-widget[data-level=\"4\"] { --threat-color: #ff2635; --threat-glow: 0.7; }\n.threat-widget[data-level=\"5\"] { --threat-color: #ff2635; --threat-glow: 0.9; }\n.threat-widget[data-level=\"6\"] { --threat-color: #ff2635; --threat-glow: 1; }\n\n/* pulse the icon — faster at higher levels */\n.threat-widget[data-level=\"3\"] .tw-icon,\n.threat-widget[data-level=\"4\"] .tw-icon,\n.threat-widget[data-level=\"5\"] .tw-icon,\n.threat-widget[data-level=\"6\"] .tw-icon { animation: threatPulse var(--threat-pulse, 1.4s) ease-in-out infinite; }\n.threat-widget[data-level=\"3\"] { --threat-pulse: 1.4s; }\n.threat-widget[data-level=\"4\"] { --threat-pulse: 1.0s; }\n.threat-widget[data-level=\"5\"] { --threat-pulse: 0.7s; }\n.threat-widget[data-level=\"6\"] { --threat-pulse: 0.45s; }\n\n/* flash whole widget on change */\n.threat-widget.is-changing {\n  animation: threatFlash 0.6s ease-out;\n}\n.threat-widget.is-up::after {\n  content: \"+1\";\n  position: absolute;\n  right: 12px;\n  top: 6px;\n  color: var(--red);\n  font-family: \"Space Grotesk\", sans-serif;\n  font-weight: 700;\n  font-size: 18px;\n  animation: threatPop 0.7s ease-out forwards;\n  pointer-events: none;\n}\n.threat-widget.is-down::after {\n  content: \"−1\";\n  position: absolute;\n  right: 12px;\n  top: 6px;\n  color: var(--paper-dim);\n  font-family: \"Space Grotesk\", sans-serif;\n  font-weight: 700;\n  font-size: 18px;\n  animation: threatPop 0.7s ease-out forwards;\n  pointer-events: none;\n}\n\n@keyframes threatPulse {\n  0%, 100% { filter: drop-shadow(0 0 4px var(--threat-color)); }\n  50% { filter: drop-shadow(0 0 calc(var(--threat-glow) * 18px) var(--threat-color)) brightness(1.25); }\n}\n\n@keyframes threatFlash {\n  0% { box-shadow: 0 0 0 0 rgba(245, 72, 72, 0.5); }\n  30% { box-shadow: 0 0 0 6px rgba(245, 72, 72, 0.35), inset 0 0 22px rgba(245, 72, 72, 0.18); }\n  100% { box-shadow: 0 0 0 0 rgba(245, 72, 72, 0); }\n}\n\n@keyframes threatPop {\n  0% { opacity: 1; transform: translateY(0); }\n  100% { opacity: 0; transform: translateY(-18px); }\n}\n\n/* presenter — also shows widget */\nbody.presenter .threat-widget {\n  left: 32px;\n  top: 56px;\n}\n\n/* alert overlay HUD */\n\n.alert-overlay { background: rgba(245, 72, 72, 0.1); }\n\n.alert-box {\n  border: var(--tweak-border) solid var(--red);\n  background: rgba(0, 0, 0, 0.96);\n  box-shadow: 0 0 80px rgba(245, 72, 72, 0.5), inset 0 0 0 1px rgba(245, 72, 72, 0.18);\n  font-family: \"JetBrains Mono\", monospace;\n}\n\n.alert-box span {\n  display: inline-block;\n  padding: 4px 14px;\n  background: var(--red);\n  color: #000;\n  letter-spacing: 3px;\n  font-family: \"JetBrains Mono\", monospace;\n}\n\n.alert-box strong {\n  display: block;\n  margin-top: 18px;\n  color: var(--paper);\n  font-family: \"Space Grotesk\", sans-serif;\n  font-weight: 700;\n  font-size: clamp(30px, 5vw, 72px);\n  line-height: 0.95;\n  letter-spacing: -1px;\n  text-transform: uppercase;\n  text-shadow:\n    2px 0 0 var(--red),\n    -2px 0 0 rgba(245, 72, 72, 0.42);\n}\n\n/* control panel HUD overrides */\n\n.control-panel {\n  background: rgba(0, 0, 0, 0.96);\n  border-left: var(--tweak-border) solid var(--line);\n  box-shadow: none;\n  font-family: \"JetBrains Mono\", monospace;\n}\n\n.control-panel header p {\n  font-family: \"JetBrains Mono\", monospace;\n  color: var(--red);\n  letter-spacing: 3px;\n  font-size: 10px;\n}\n\n.control-panel h1 {\n  font-family: \"Space Grotesk\", sans-serif;\n  font-weight: 700;\n  font-size: 26px;\n  letter-spacing: -0.5px;\n  text-transform: uppercase;\n  text-shadow:\n    1px 0 0 var(--red),\n    -1px 0 0 rgba(245, 72, 72, 0.42);\n}\n\n.control-panel button,\n.control-panel select,\n.control-panel textarea,\n.control-panel input[type=\"file\"],\n.control-panel input[type=\"text\"],\n.control-panel input[type=\"color\"] {\n  border: var(--tweak-border) solid var(--line);\n  background: rgba(0, 0, 0, 0.86);\n  color: var(--paper);\n  font-family: \"JetBrains Mono\", monospace;\n  font-size: 11px;\n  letter-spacing: 0.4px;\n  box-shadow: none;\n}\n\n.control-panel button { text-transform: uppercase; letter-spacing: 1.4px; color: var(--cream); }\n.control-panel button:hover {\n  background: rgba(245, 72, 72, 0.15);\n  border-color: var(--red);\n  box-shadow: none;\n  transform: none;\n}\n\n.danger-btn {\n  background: var(--red) !important;\n  color: #000 !important;\n  border-color: var(--red) !important;\n  font-weight: 700;\n}\n\n.field,\n.threat,\ndetails {\n  background: rgba(0, 0, 0, 0.5);\n  border: var(--tweak-border) solid var(--line-soft);\n  box-shadow: none;\n}\n\nsummary {\n  color: var(--red);\n  font-family: \"JetBrains Mono\", monospace;\n  letter-spacing: 2px;\n  font-size: 11px;\n}\n\n.threat-cell {\n  border: 1px solid var(--line-soft);\n  background: rgba(0, 0, 0, 0.5);\n  border-radius: 0;\n}\n\n.threat-cell.is-filled {\n  background: var(--red);\n  box-shadow: 0 0 12px var(--red);\n}\n\n.stage-item {\n  background: rgba(0, 0, 0, 0.5);\n  border: 1px solid var(--line-soft);\n  border-radius: 0;\n  font-family: \"JetBrains Mono\", monospace;\n}\n\n.stage-item.is-active {\n  border-color: var(--red);\n  background: rgba(245, 72, 72, 0.1);\n  box-shadow: none;\n}\n\n.stage-item.is-complete {\n  background: rgba(245, 72, 72, 0.05);\n}\n\n.stage-item b { color: var(--paper); text-transform: uppercase; letter-spacing: 1px; }\n.stage-item small { color: var(--paper-dim); }\n.stage ">Стоп<\/button>\n            <\/div>\n          <\/div>\n\n          <div class=\"field\">\n            <label for=\"eventSelect\">Сценарные вспышки<\/label>\n            <select id=\"eventSelect\">\n              <option value=\"order\">Орден наносит 1 урон<\/option>\n              <option value=\"chaos\">Очки хаоса получены<\/option>\n              <option value=\"ritual\">Ритуал сорвался<\/option>\n              <option value=\"system\">ИИ принял запрос<\/option>\n              <option value=\"traitor\">Обнаружен предатель<\/option>\n            <\/select>\n            <button id=\"eventBtn\">Вывести на экран<\/button>\n          <\/div>\n        <\/details>\n\n        <details>\n          <summary>Своя карта и точки<\/summary>\n          <div class=\"field\">\n            <label for=\"mapFit\">Поведение карты<\/label>\n            <select id=\"mapFit\">\n              <option value=\"cover\">Заполнить экран<\/option>\n              <option value=\"contain\">Вписать целиком<\/option>\n              <option value=\"fill\">Растянуть<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"field\">\n            <label for=\"mapUpload\">Загрузить изображение карты<\/label>\n            <input id=\"mapUpload\" type=\"file\" accept=\"image/*\">\n          <\/div>\n          <button id=\"resetBtn\">Сбросить карту и точки<\/button>\n        <\/details>\n\n        <details open=\"\">\n          <summary>Редактор точки и хаоса<\/summary>\n          <input id=\"editRadius\" type=\"hidden\">\n          <input id=\"editX\" type=\"hidden\">\n          <input id=\"editY\" type=\"hidden\">\n          <div class=\"editor-grid\">\n            <div class=\"field\">\n              <label for=\"highlightStyle\">Тип подсветки<\/label>\n              <select id=\"highlightStyle\">\n                <option value=\"breach\">Разлом<\/option>\n                <option value=\"pulse\">Пульс<\/option>\n                <option value=\"scan\">Сканер<\/option>\n >\n            <\/div>\n            <div class=\"field\">\n              <label for=\"regionParticleDensity\">Плотность частиц<\/label>\n              <input id=\"regionParticleDensity\" type=\"range\" min=\"0\" max=\"7\" step=\"1\">\n            <\/div>\n            <div class=\"field\">\n              <label for=\"regionParticleSize\">Размер частиц<\/label>\n              <input id=\"regionParticleSize\" type=\"range\" min=\"2\" max=\"12\" step=\"1\">\n            <\/div>\n          <\/div>\n          <div class=\"controls-row compact\">\n            <button id=\"previewChaosBtn\">Предпросмотр<\/button>\n            <button id=\"applyChaosBtn\">Применить<\/button>\n            <button id=\"resetChaosBtn\">Сбросить<\/button>\n          <\/div>\n          <div class=\"edit-zoom-controls\">\n            <button id=\"editZoomMinus\">−<\/button>\n            <button id=\"editZoomReset\">1:1<\/button>\n            <button id=\"editZoomPlus\">+<\/button>\n          <\/div>\n          <div class=\"field\">\n            <label>Контур области<\/label>\n            <div class=\"region-tools\">\n              <button id=\"drawRegionBtn\">Рисовать<\/button>\n              <button id=\"undoRegionPointBtn\">Назад<\/button>\n              <button id=\"clearRegionBtn\">Очистить<\/button>\n            <\/div>\n            <div class=\"region-tools region-tools-secondary\">\n              <button id=\"shrinkRegionBtn\">Сжать<\/button>\n              <button id=\"expandRegionBtn\">Расширить<\/button>\n              <button id=\"centerRegionBtn\">К точке<\/button>\n            <\/div>\n          <\/div>\n        <\/details>\n\n        <details>\n          <summary>Живые герои<\/summary>\n          <div id=\"heroEditorList\" class=\"hero-editor-list\"><\/div>\n        <\/details>\n\n        <details>\n          <summary>Звук<\/summary>\n          <div class=\"sound-grid\">\n            <div class=\"field\">\n              <label for=\"soundUpload\">Тревога<\/label>\n              <inpu
